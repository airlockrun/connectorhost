name: publish-binaries

on:
  workflow_call:
    inputs:
      version:
        description: Existing release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to republish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-release.sh
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "$RELEASE_VERSION" --generate-notes
          fi
